name: JobseekeR CI/CD Pipeline

on:
  push:
    branches: [main, Develop]
  pull_request:
    branches: [main, Develop]

env:
  CI: "true"
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/jobseeker_ci?schema=public"
  TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/jobseeker_ci?schema=public"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobseeker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Setup Database & Generate Prisma Client
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm test

      - name: Run Integration Tests
        run: npm run test:integration
        env:
          JOBSEEKER_TEST_MODE: "integration"
          TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/jobseeker_ci?schema=public"
          CI: "true"

      - name: Build Next.js Application
        run: npm run build
