name: JobseekeR CI/CD Pipeline

on:
  push:
    branches: [ main, Develop ]
  pull_request:
    branches: [ main, Develop ]

env:
  DATABASE_URL: "file:./dev.db"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Database & Generate Prisma Client
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm test

      - name: Build Next.js Application
        run: npm run build
